# @@@SNIPSTART go-cloud-run-otel-collector-config
# Google-Built OpenTelemetry Collector sidecar: metrics -> Managed Service for Prometheus, traces -> Cloud Trace.
# Auth uses the worker-pool service account (ADC).
receivers:
    otlp:
        protocols:
            grpc:
                endpoint: localhost:4317

processors:
    memory_limiter:
        check_interval: 1s
        limit_percentage: 65
        spike_limit_percentage: 20
    resource_detection:
        detectors: [gcp]
        timeout: 10s
    # Batch traces for throughput. Do NOT batch the cumulative-metrics pipeline: a shutdown flush
    # could be merged with a recent periodic export of the same series and rejected as a duplicate.
    batch/traces:
        send_batch_size: 200
        timeout: 5s
    # Rename Temporal datapoint labels that collide with the target labels Managed Service for Prometheus injects (e.g. namespace).
    transform/collision:
        metric_statements:
            - context: datapoint
              statements:
                  - set(attributes["exported_location"], attributes["location"])
                  - delete_key(attributes, "location")
                  - set(attributes["exported_cluster"], attributes["cluster"])
                  - delete_key(attributes, "cluster")
                  - set(attributes["exported_namespace"], attributes["namespace"])
                  - delete_key(attributes, "namespace")
                  - set(attributes["exported_job"], attributes["job"])
                  - delete_key(attributes, "job")
                  - set(attributes["exported_instance"], attributes["instance"])
                  - delete_key(attributes, "instance")
                  - set(attributes["exported_project_id"], attributes["project_id"])
                  - delete_key(attributes, "project_id")
    # The Telemetry API expects the Google Cloud project in gcp.project_id.
    transform/set_project_id:
        error_mode: ignore
        trace_statements:
            - set(resource.attributes["gcp.project_id"], resource.attributes["gcp.project.id"]) where resource.attributes["gcp.project.id"] != nil
            - set(resource.attributes["gcp.project_id"], resource.attributes["cloud.account.id"]) where resource.attributes["gcp.project_id"] == nil and resource.attributes["cloud.account.id"] != nil

exporters:
    googlemanagedprometheus:
    otlp_grpc:
        endpoint: telemetry.googleapis.com:443
        compression: none
        balancer_name: pick_first
        auth:
            authenticator: googleclientauth

extensions:
    googleclientauth:
    health_check:
        endpoint: 0.0.0.0:13133

service:
    extensions: [googleclientauth, health_check]
    pipelines:
        metrics:
            receivers: [otlp]
            processors: [memory_limiter, resource_detection, transform/collision]
            exporters: [googlemanagedprometheus]
        traces:
            receivers: [otlp]
            processors: [memory_limiter, resource_detection, transform/set_project_id, batch/traces]
            exporters: [otlp_grpc]
    telemetry:
        logs:
            level: info
# @@@SNIPEND
